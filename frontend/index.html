<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EKS 3-Tier Platform</title>
<style>
 body{font-family:Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);
      color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:20px}
 .card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:40px;max-width:560px;width:100%;
       box-shadow:0 20px 60px rgba(0,0,0,.4)}
 .badge{display:inline-block;background:rgba(34,197,94,.15);color:#4ade80;padding:6px 14px;border-radius:20px;
        font-size:13px;font-weight:600;margin-bottom:20px}
 h1{margin:0 0 6px;font-size:26px;color:#f8fafc}
 p.sub{color:#94a3b8;margin:0 0 28px}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
 .item{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:14px}
 .label{font-size:11px;text-transform:uppercase;color:#64748b;margin-bottom:6px}
 .value{font-family:Courier New,monospace;font-weight:600;word-break:break-all}
 button{margin-top:22px;width:100%;padding:12px;border:0;border-radius:10px;background:#2563eb;
        color:#fff;font-weight:600;cursor:pointer}
 .foot{margin-top:24px;padding-top:18px;border-top:1px solid #334155;font-size:12px;color:#64748b;text-align:center}
</style></head>
<body><div class="card">
 <span class="badge" id="status">● CONNECTING</span>
 <h1>EKS 3-Tier Platform</h1>
 <p class="sub">ALB → Frontend → Backend API → PostgreSQL (EBS)</p>
 <div class="grid">
  <div class="item"><div class="label">Total visits (DB)</div><div class="value" id="total">-</div></div>
  <div class="item"><div class="label">Served by backend pod</div><div class="value" id="pod">-</div></div>
 </div>
 <button onclick="visit()">Record a visit</button>
 <div class="foot">GitHub Actions → ArgoCD → Amazon EKS</div>
</div>
<script>
async function visit(){
  try{
    const r=await fetch('/api/visit'); const d=await r.json();
    document.getElementById('total').textContent=d.total_visits;
    document.getElementById('pod').textContent=d.served_by;
    const s=document.getElementById('status'); s.textContent='● ALL SYSTEMS HEALTHY';
  }catch(e){document.getElementById('status').textContent='● BACKEND UNREACHABLE';}
}
visit();
</script></body></html>
